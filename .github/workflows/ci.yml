name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    # Standard GitHub-hosted runner: free for public repositories. Avoid -large/-xlarge (always billed).
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Package tests
        working-directory: Packages/ShowRecorderKit
        run: swift test

      - name: Build for macOS
        run: >
          xcodebuild -project ShowRecorder.xcodeproj -scheme ShowRecorder
          -destination 'platform=macOS' -derivedDataPath build/dd
          CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build

      - name: Build for iOS Simulator
        run: >
          xcodebuild -project ShowRecorder.xcodeproj -scheme ShowRecorder
          -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd
          CODE_SIGNING_ALLOWED=NO build
