name: CI

on:
  pull_request:
  push:
    branches: [main, 'release/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which parts changed: the app (anything outside website/) and the site (website/).
  # A change to this workflow runs both.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
      site: ${{ steps.diff.outputs.site }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No usable base; running everything."
            site=true; [ -f website/package.json ] || site=false
            echo "app=true" >> "$GITHUB_OUTPUT"; echo "site=$site" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE"...HEAD)
          printf '%s\n' "$files"
          app=false; site=false
          if printf '%s\n' "$files" | grep -qvE '^website/|^$'; then app=true; fi
          if printf '%s\n' "$files" | grep -qE '^website/|^\.github/workflows/ci\.yml$'; then site=true; fi
          # Nothing to build until the site is on this branch.
          if [ ! -f website/package.json ]; then site=false; fi
          echo "app=$app" >> "$GITHUB_OUTPUT"; echo "site=$site" >> "$GITHUB_OUTPUT"
          echo "app=$app site=$site"

  app:
    name: App (${{ matrix.check }})
    needs: changes
    if: needs.changes.outputs.app == 'true'
    # Standard GitHub-hosted runner: free for public repositories. Avoid -large/-xlarge (always billed).
    runs-on: macos-26
    timeout-minutes: 40
    # The three checks run side by side on their own runners. Each compiles from scratch anyway (a fresh
    # checkout defeats incremental builds, and Xcode's compilation cache saved only about 10% when measured),
    # so splitting them cuts the wait from the sum of the three to the longest one.
    strategy:
      fail-fast: false
      matrix:
        check: [package tests, macOS build, iOS Simulator build]
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Vocabulary (CONTEXT.md)
        if: matrix.check == 'package tests'
        run: |
          command -v rg >/dev/null || brew install ripgrep
          ./scripts/vocab-check.sh

      - name: Package tests
        if: matrix.check == 'package tests'
        working-directory: Packages/ShowRecorderKit
        run: swift test

      # TestFlight builds are Release. Mixer detection once worked in Debug but opened port 0 in Release (v1.1.1,
      # EINVAL on the iPhone): its tests run optimized too.
      - name: Package tests, Release (Mixer detection)
        if: matrix.check == 'package tests'
        working-directory: Packages/ShowRecorderKit
        run: swift test -c release --filter DetectingMixerDriver

      - name: Build for macOS
        if: matrix.check == 'macOS build'
        run: >
          xcodebuild -project ShowRecorder.xcodeproj -scheme ShowRecorder
          -destination 'platform=macOS' -derivedDataPath build/dd
          CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build

      - name: Build for iOS Simulator
        if: matrix.check == 'iOS Simulator build'
        run: >
          xcodebuild -project ShowRecorder.xcodeproj -scheme ShowRecorder
          -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd
          CODE_SIGNING_ALLOWED=NO build

  site:
    name: Website
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: website/.nvmrc

      - name: Find the Yarn cache
        id: yarn
        run: |
          corepack enable
          echo "cache=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      # Package archives, keyed on the lockfile. A pull request reads main's cache.
      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn.outputs.cache }}
          key: yarn-${{ runner.os }}-${{ hashFiles('website/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      # Next's build cache: a page that didn't change isn't compiled again.
      - uses: actions/cache@v4
        with:
          path: website/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('website/yarn.lock') }}-${{ hashFiles('website/app/**', 'website/components/**', 'website/lib/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('website/yarn.lock') }}-

      - name: Install
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Tests
        run: yarn test:run

      - name: Build (static export)
        run: yarn build

      # The image Coolify deploys: catches a broken Dockerfile or nginx.conf before it reaches main.
      - name: Docker image
        run: docker build -t showrecorder-site:ci .

  # The required check. It passes when every job that ran passed; skipped jobs are fine.
  gate:
    name: Test and build
    needs: [changes, app, site]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          CHANGES: ${{ needs.changes.result }}
          APP: ${{ needs.app.result }}
          SITE: ${{ needs.site.result }}
        run: |
          echo "changes=$CHANGES app=$APP site=$SITE"
          [ "$CHANGES" = success ] || exit 1
          for r in "$APP" "$SITE"; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
