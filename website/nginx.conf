# Serves the Next static export (out/) for showrecorder.app.
# Installed as /etc/nginx/conf.d/default.conf, so it sits inside nginx's http {} block.
# Coolify's proxy terminates TLS in front of this container; nginx itself only speaks HTTP.

# No nginx version in the Server header or on error pages, for every server block below.
server_tokens off;

# One Cache-Control per response, chosen by path. Setting it here rather than with add_header
# inside a location keeps the security headers below on every response (a location-level
# add_header would replace all of them).
map $uri $cache_control {
    ~^/_next/static/   "public, max-age=31536000, immutable";
    default            "public, max-age=300";
}

# Coolify pull-request previews (<pr>.showrecorder.app) serve this same build: keep them out of search
# results so they never compete with the real site. Only the real host is indexable.
map $host $robots_tag {
    showrecorder.app  "";
    default           "noindex, nofollow";
}

# A /mixers/ address that is not a page but starts with a mixer's name -> that mixer's page. A post
# that ran a link into the next word sent visitors to /mixers/x32Tell (Facebook, 2026-10-28). Used only
# by @mixer_typo below, after the real page was not found. One line per folder in app/mixers
# (tests/mixerTypoRedirect.test.ts checks), longer names first; "~*" also matches /mixers/X32.
map $uri $mixer_typo_target {
    ~*^/mixers/xr18  /mixers/xr18;
    ~*^/mixers/x32   /mixers/x32;
    default          "";
}

# www.showrecorder.app -> https://showrecorder.app, same path.
server {
    listen 80;
    server_name www.showrecorder.app;
    return 301 https://showrecorder.app$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects send a path only (Location: /privacy), so they keep the https the proxy used.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag $robots_tag always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    # Next's static export inlines its bootstrap scripts, hence 'unsafe-inline' for scripts.
    # errors.ericdahl.dev is GlitchTip, where lib/errors.ts sends errors from the visitor's browser (#1026).
    # chatwoot.ericdahl.dev is the support chat on /support (components/ChatButton.tsx). It loads only when the visitor
    # presses "Chat with us": its script, its iframe, its API and websocket, and its avatars.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://us-assets.i.posthog.com https://chatwoot.ericdahl.dev; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://chatwoot.ericdahl.dev; font-src 'self'; connect-src 'self' https://errors.ericdahl.dev https://us.i.posthog.com https://us-assets.i.posthog.com https://chatwoot.ericdahl.dev wss://chatwoot.ericdahl.dev; frame-src https://chatwoot.ericdahl.dev; object-src 'none'; base-uri 'self'; form-action 'self' https://buttondown.com; frame-ancestors 'none'" always;

    error_page 404 /404.html;

    # The XR18 setup guide moved when it was renamed for the cable and setup topic (#704).
    location = /docs/connecting-xr18 { return 301 /docs/usb-cable-and-setup; }

    # Any /<path>.html -> /<path> (301), keeping the query string; /index.html -> /.
    # These test $request_uri, the address the client asked for, which internal redirects never
    # change. So `index` serving / from /index.html and error_page serving /404.html run as
    # before and cannot loop. The first path character must not be a slash: //evil.com/x.html
    # would otherwise redirect to //evil.com/x, another site.
    if ($request_uri ~ "^/index\.html(?<html_query>\?.*)?$") {
        return 301 /$html_query;
    }
    if ($request_uri ~ "^(?<html_path>/[^/?][^?]*)\.html(?<html_query>\?.*)?$") {
        return 301 $html_path$html_query;
    }

    # /404.html redirects to /404 above; answer that with the 404 page and a 404 status rather
    # than serving 404.html as a page.
    location = /404 { return 404; }

    # Trailing slash -> no trailing slash (/privacy/ -> /privacy). "/" itself does not match.
    # $uri is decoded, so the first path character must not be a slash, backslash or whitespace:
    # /%5Cevil.com/ and /%09/evil.com/ would otherwise redirect to //evil.com (#873). They 404.
    location ~ "^(/[^/\\\\\s].*)/$" {
        return 301 $1$is_args$args;
    }

    location / {
        # /privacy is served from privacy.html.
        try_files $uri $uri.html $uri/ =404;
    }

    # Mixer pages as above; an address that is not a page tries the mistyped-mixer redirect.
    location /mixers/ {
        try_files $uri $uri.html $uri/ @mixer_typo;
    }

    # The target is a fixed path from the map, never taken from the request, so it cannot leave the site.
    location @mixer_typo {
        # The page itself but its file was not served (missing or unreadable): 404, never a redirect loop.
        if ($uri = $mixer_typo_target) {
            return 404;
        }
        if ($mixer_typo_target) {
            return 301 $mixer_typo_target$is_args$args;
        }
        return 404;
    }
}
