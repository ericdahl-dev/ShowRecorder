# Serves the Next static export (out/) for showrecorder.app.
# Installed as /etc/nginx/conf.d/default.conf, so it sits inside nginx's http {} block.
# Coolify's proxy terminates TLS in front of this container; nginx itself only speaks HTTP.

# One Cache-Control per response, chosen by path. Setting it here rather than with add_header
# inside a location keeps the security headers below on every response (a location-level
# add_header would replace all of them).
map $uri $cache_control {
    ~^/_next/static/   "public, max-age=31536000, immutable";
    default            "public, max-age=300";
}

# www.showrecorder.app -> https://showrecorder.app, same path.
server {
    listen 80;
    server_name www.showrecorder.app;
    return 301 https://showrecorder.app$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Redirects send a path only (Location: /privacy), so they keep the https the proxy used.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    # Next's static export inlines its bootstrap scripts, hence 'unsafe-inline' for scripts.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    error_page 404 /404.html;

    # /privacy.html and /support.html -> clean URLs. Exact matches, so the internal
    # error_page redirect to /404.html is never caught by a redirect rule.
    location = /privacy.html { return 301 /privacy; }
    location = /support.html { return 301 /support; }
    # No such rule for /index.html: `index` redirects / to it internally, so it would loop.

    # Trailing slash -> no trailing slash (/privacy/ -> /privacy). "/" itself does not match.
    location ~ ^(.+)/$ {
        return 301 $1$is_args$args;
    }

    location / {
        # /privacy is served from privacy.html.
        try_files $uri $uri.html $uri/ =404;
    }
}
