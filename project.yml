name: ShowRecorder
options:
  bundleIdPrefix: dev.ericdahl
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  ShowRecorderKit:
    path: Packages/ShowRecorderKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  ShowRecorder:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
        excludes:
          - ShowRecorder.storekit
      # Local StoreKit testing only (the scheme's Run action); never copied into the app.
      - path: App/ShowRecorder.storekit
        buildPhase: none
    scheme:
      storeKitConfiguration: App/ShowRecorder.storekit
    dependencies:
      - package: ShowRecorderKit
        product: AudioIO
      - package: ShowRecorderKit
        product: Recording
      - package: ShowRecorderKit
        product: CoreAudioIO
      - package: ShowRecorderKit
        product: MixerLink
      - package: ShowRecorderKit
        product: Destinations
      - package: ShowRecorderKit
        product: TakeActivity
      - package: ShowRecorderKit
        product: WatchRemote
      # The Live Activity (#136): iPhone only, so the Mac app embeds no extension and needs no profile for it.
      - target: ShowRecorderLiveActivity
        destinationFilters: [iOS]
    entitlements:
      path: App/ShowRecorder.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ShowRecorder
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        # Required for a Mac App Store upload; iOS ignores it.
        LSApplicationCategoryType: public.app-category.music
        NSMicrophoneUsageDescription: ShowRecorder records every channel from your mixer.
        NSLocalNetworkUsageDescription: ShowRecorder reads channel names and colors from your mixer over the local network.
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes:
          - audio
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ericdahl.ShowRecorder
        # Set by the release workflow, which signs each target with its own App Store profile; empty locally.
        PROVISIONING_PROFILE_SPECIFIER: $(APP_PROFILE_NAME)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: true

  # The running Take's Live Activity in the Dynamic Island and on the Lock Screen (#136).
  ShowRecorderLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveActivity
    dependencies:
      - package: ShowRecorderKit
        product: TakeActivity
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: ShowRecorder
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ericdahl.ShowRecorder.LiveActivity
        PROVISIONING_PROFILE_SPECIFIER: $(EXTENSION_PROFILE_NAME)
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: true
